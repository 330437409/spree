en:
  spree:
    errors:
      messages:
        not_a_registered_membership_right: is not a kind of right this deployment has
    memberships:
      tier_catalog_name: "%{name} — member price"
      tier_price_list_name: "%{name} — member price list"
      errors:
        store_missing: the tier's store cannot be reached
        catalog_unavailable: the member price catalogue could not be set up
        card_not_activatable: this card cannot be activated
        card_expired: this card expired before it was activated
        ends_before_start: must be on or after the start
        live_term_exists: this customer already holds a live term for that tier
        tier_unknown: this tier is not one this store sells
        card_not_giftable: this card cannot be given away
        card_transferring: this card is on its way to somebody else
        promotion_unknown: the coupon this tier hands over is not one this store runs
        gift_not_a_gift: this right is not a tier's annual gift
        banner_areas_invalid: the banner's targets must be a list
        gift_not_coupons: this tier's annual gift is not a coupon
        gift_not_the_tiers: this annual gift belongs to a tier you are not on
        gift_coupon_unknown: this coupon is not one of the annual gift's
        gift_claimed: every coupon of this annual gift has been claimed this year
        gift_empty: this tier's annual gift has no coupons yet
        gift_coupon_none_left: this annual gift's coupon has no codes left to hand over
        gift_coupon_taken_back: this annual gift's coupon was taken back and cannot be claimed again this year
        gift_coupon_contended: another request took this annual gift's coupon at the same moment, try again
        gift_coupon_unavailable: this annual gift's coupon could not be handed over
        gift_allowance_spent: this year's annual gift has already been claimed
        tier_open_ended: this customer holds a tier with no end, so a new one cannot wait for it
    membership_right_types:
      entry_integral:
        name: Entry points
        description: Points credited when the member enters this tier
      member_price:
        name: Member price
        description: The price this tier's catalogue gives its members
      exclusive_coupon:
        name: Exclusive coupon
        description: A coupon only this tier holds
      coupon:
        name: Coupon
        description: A coupon the tier carries
      large_coupon:
        name: Large coupon
        description: A big-face coupon, exchanged upwards
      add_bag:
        name: Member pack
        description: This tier may buy the member add-on pack
      priority_distribution:
        name: Priority distribution
        description: Priority when orders are distributed
      birthday_double_integral:
        name: Birthday points
        description: Points are multiplied on the customer's birthday
      give_gift:
        name: Annual gift
        description: The gift this tier receives each year
      surprise_red_envelope:
        name: Surprise red envelope
        description: A red packet, for the member and for a friend
      svip_date:
        name: Member day
        description: A day the tier's members buy on better terms
